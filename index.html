<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>Regenradar</title>

<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Regenradar" />
<meta name="theme-color" content="#0f1420" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="manifest" href="manifest.json" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">
  <header>
    <h1>Regenradar</h1>
    <span id="timestamp">–</span>
  </header>

  <div id="map">
    <div id="status"></div>
  </div>

  <footer>
    <button id="playBtn" class="icon-btn" aria-label="Play/Pause">▶</button>
    <input id="slider" type="range" min="0" max="0" value="0" step="1" />
  </footer>

  <div id="forecastSheet" class="forecast-panel">
    <div class="forecast-sheet-header">
      <span class="forecast-header-text">
        <span id="forecastLocationName"></span>
        <span id="forecastDateLabel" class="forecast-date-label"></span>
      </span>
    </div>
    <div id="forecastStrip" class="forecast-strip"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="app.js"></script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  }
</script>
</body>
</html>
