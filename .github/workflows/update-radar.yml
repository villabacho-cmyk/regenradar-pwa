name: Update radar frames

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-radar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Radar-Frames holen
        run: python3 scripts/fetch_radar.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar

          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi

          # Radar-Updates werden auf dem letzten Bot-Commit amended statt
          # angehaengt, sonst waechst das Repo alle 10 Minuten um ~1MB
          # (~1GB in wenigen Wochen). Ein "echter" Commit (von mir) startet
          # automatisch wieder einen neuen Bot-Commit obendrauf.
          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
            git commit --amend --no-edit
          else
            git commit -m "Radar-Frames aktualisiert"
          fi
          git push --force-with-lease
