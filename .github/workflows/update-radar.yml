name: Update radar frames

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-radar
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Volle Historie statt Standard-Flach-Checkout: ein flacher
          # Checkout hat in Kombination mit "git commit --amend" schon
          # einmal dazu gefuehrt, dass die komplette Repo-Historie beim
          # Push auf einen wurzellosen Einzel-Commit zusammenfiel.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Radar-Frames holen
        run: python3 scripts/fetch_radar.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/radar

          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi

          # Radar-Updates werden auf dem letzten *eigenen* Bot-Commit amended
          # statt angehaengt, sonst waechst das Repo alle 10 Minuten um ~1MB
          # (~1GB in wenigen Wochen). Pruefung ueber die Commit-Message statt
          # nur den Autor-Namen, da der Temperatur-Workflow denselben
          # Bot-Autor nutzt - sonst amended dieser Job versehentlich den
          # Commit des anderen Workflows (passiert, hat Pushes zerschossen).
          LAST_MSG=$(git log -1 --pretty=format:'%s')
          if [ "$LAST_MSG" = "Radar-Frames aktualisiert" ]; then
            git commit --amend --no-edit
          else
            git commit -m "Radar-Frames aktualisiert"
          fi

          # Falls der Remote sich seit dem Checkout weiterbewegt hat (z.B.
          # der andere Workflow war schneller): einmal neu ansetzen statt
          # den ganzen Lauf scheitern zu lassen.
          if ! git push --force-with-lease; then
            git fetch origin main
            git reset --soft origin/main
            git add data/radar
            git commit -m "Radar-Frames aktualisiert"
            git push --force-with-lease
          fi
