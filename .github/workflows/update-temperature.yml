name: Update temperature data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-temperature
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Temperatur-/Sonnenschein-Daten holen
        run: python3 scripts/fetch_temperature.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/temperature

          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi

          # Pruefung ueber die Commit-Message statt nur den Autor-Namen, da
          # der Radar-Workflow denselben Bot-Autor nutzt - sonst amended
          # dieser Job versehentlich den Commit des anderen Workflows
          # (passiert, hat Pushes zerschossen).
          LAST_MSG=$(git log -1 --pretty=format:'%s')
          if [ "$LAST_MSG" = "Temperaturdaten aktualisiert" ]; then
            git commit --amend --no-edit
          else
            git commit -m "Temperaturdaten aktualisiert"
          fi

          # Falls der Remote sich seit dem Checkout weiterbewegt hat (z.B.
          # der andere Workflow war schneller): einmal neu ansetzen statt
          # den ganzen Lauf scheitern zu lassen.
          if ! git push --force-with-lease; then
            git fetch origin main
            git reset --soft origin/main
            git add data/temperature
            git commit -m "Temperaturdaten aktualisiert"
            git push --force-with-lease
          fi
