name: Update temperature data

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-temperature
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Temperatur-/Sonnenschein-Daten holen
        run: python3 scripts/fetch_temperature.py

      - name: Aenderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/temperature

          if git diff --cached --quiet; then
            echo "Keine Aenderungen."
            exit 0
          fi

          LAST_AUTHOR=$(git log -1 --pretty=format:'%an')
          if [ "$LAST_AUTHOR" = "github-actions[bot]" ]; then
            git commit --amend --no-edit
          else
            git commit -m "Temperaturdaten aktualisiert"
          fi
          git push --force-with-lease
